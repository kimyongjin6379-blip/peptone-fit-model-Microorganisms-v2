# Railway uses Nixpacks for auto-build
# HMMER: KofamScan HMM search engine
# Ruby: KofamScan exec_annotation script
# Python: must be explicit when overriding phases.setup
[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc", "hmmer", "ruby", "wget", "gzip", "sqlite"]

[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    "/opt/venv/bin/pip install --upgrade pip",
    "/opt/venv/bin/pip install -r requirements.txt",
    "/opt/venv/bin/pip install -e . || echo 'editable install skipped'",
    "chmod +x scripts/setup_kofamscan.sh start.sh",
]

[start]
cmd = "bash start.sh"
